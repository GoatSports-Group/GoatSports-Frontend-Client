<div class="space-y-1.5 w-full">
  <div class="flex justify-between items-center h-4">
    <label class="block text-[13px] font-extrabold uppercase tracking-wide text-slate-700 dark:text-slate-400 font-sports-display">
      {{ label() }}
    </label>
    @if (showError() && errorMessage()) {
    <span
      class="text-[11px] font-extrabold text-rose-600 flex items-center gap-1 animate-fade-in uppercase font-sports-display tracking-wider">
      {{ errorMessage() }}
    </span>
    }
  </div>
  <div class="relative group">
    @if (icon()) {
    <span
      class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none z-10 text-slate-500 group-focus-within:text-emerald-600 transition-colors duration-200">
      <lucide-icon [name]="icon()" class="w-5 h-5 block"></lucide-icon>
    </span>
    }
    <ng-content></ng-content>
  </div>
</div>
