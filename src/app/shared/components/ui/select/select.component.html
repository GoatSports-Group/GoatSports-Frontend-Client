<div class="app-select" [class.is-open]="open" [class.is-disabled]="disabled">
  <button
    type="button"
    class="app-select__trigger"
    [disabled]="disabled"
    [attr.aria-expanded]="open"
    aria-haspopup="listbox"
    (click)="toggle($event)"
    (keydown)="handleKeydown($event)">
    <span [class.is-placeholder]="!value">{{ selectedLabel }}</span>
    <svg class="app-select__chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="m6 8 4 4 4-4" />
    </svg>
  </button>

  @if (open) {
    <div class="app-select__panel" role="listbox">
      @for (option of options; track option.value) {
        <button
          type="button"
          class="app-select__option"
          [class.is-selected]="option.value === value"
          [disabled]="option.disabled"
          [attr.aria-selected]="option.value === value"
          role="option"
          (click)="select(option, $event)">
          <span>{{ option.label }}</span>
          @if (option.value === value) {
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="m5 10 3 3 7-7" />
            </svg>
          }
        </button>
      }
    </div>
  }
</div>
