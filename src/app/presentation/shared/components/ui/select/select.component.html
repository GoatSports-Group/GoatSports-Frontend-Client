<div class="app-select" [class.is-open]="open" [class.is-disabled]="disabled" [class]="'size-' + size">
  <!-- Dropdown Trigger -->
  <button
    type="button"
    class="app-select__trigger"
    [disabled]="disabled"
    [attr.aria-expanded]="open"
    aria-haspopup="listbox"
    (click)="toggle($event)"
    (keydown)="handleKeydown($event)"
  >
    <span class="app-select__label-text" [class.is-placeholder]="!selectedLabel">
      {{ selectedLabel || placeholder }}
    </span>
    <svg class="app-select__chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="m6 8 4 4 4-4" />
    </svg>
  </button>

  <!-- Dropdown Menu Panel -->
  @if (open) {
    <div class="app-select__panel" role="listbox" (click)="$event.stopPropagation()">
      <!-- Optional Search Bar -->
      @if (searchable) {
        <div class="app-select__search-wrap">
          <svg class="app-select__search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" />
          </svg>
          <input
            #searchInput
            type="text"
            class="app-select__search-input"
            [placeholder]="searchPlaceholder"
            [(ngModel)]="searchQuery"
            (click)="$event.stopPropagation()"
          />
        </div>
      }

      <!-- Options List -->
      <div class="app-select__options-list">
        @for (option of filteredOptions; track option.value) {
          <button
            type="button"
            class="app-select__option"
            [class.is-selected]="option.value === value"
            [disabled]="option.disabled"
            [attr.aria-selected]="option.value === value"
            role="option"
            (click)="select(option, $event)"
          >
            <span class="option-label">{{ option.label }}</span>
            @if (option.value === value) {
              <svg class="option-check-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2">
                <path stroke-linecap="round" stroke-linejoin="round" d="m5 10 3.5 3.5L15 6" />
              </svg>
            }
          </button>
        } @empty {
          <div class="app-select__empty">
            Không tìm thấy kết quả
          </div>
        }
      </div>
    </div>
  }
</div>
