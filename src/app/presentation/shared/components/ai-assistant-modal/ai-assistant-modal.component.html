<!-- Floating Trigger Button -->
<button type="button" class="floating-ai-btn" aria-label="Mở trợ lý GOAT Sports" [attr.aria-expanded]="isOpen" [attr.aria-controls]="isOpen ? 'ai-assistant-dialog' : null" (click)="toggleChat()">
  <i class="pi pi-bolt" aria-hidden="true"></i>
  <span class="ai-label">Trợ lý AI</span>
</button>

<!-- Chat Window -->
<div id="ai-assistant-dialog" class="ai-chat-window" *ngIf="isOpen" appAccessibleDialog aria-labelledby="ai-assistant-title" (dialogClosed)="toggleChat()">
  <div class="chat-header">
    <div class="bot-profile">
      <div class="bot-avatar"><i class="pi pi-bolt"></i></div>
      <div>
        <h4 id="ai-assistant-title">GOAT Sports AI</h4>
        <span class="status-dot">Trực tuyến</span>
      </div>
    </div>
    <button type="button" class="btn-close" aria-label="Đóng trợ lý" (click)="toggleChat()"><i class="pi pi-times" aria-hidden="true"></i></button>
  </div>

  <div class="chat-messages">
    <div class="msg-bubble" *ngFor="let m of messages" [class.user]="m.sender === 'USER'" [class.ai]="m.sender === 'AI'">
      <p class="text">{{ m.text }}</p>

      <!-- Suggested Venues -->
      <div class="venues-suggestions" *ngIf="m.venues && m.venues.length > 0">
        <button type="button" class="sugg-card" *ngFor="let v of m.venues" (click)="goToVenue(v.venueId)">
          <h5>{{ v.venueName }}</h5>
          <span class="meta">
            {{ v.distanceKm }} km • {{ v.rating }}/5
            @if (v.minPrice != null) { • từ {{ v.minPrice | number:'1.0-0' }}đ/giờ }
          </span>
          <p class="reason">{{ v.matchReason }}</p>
        </button>
      </div>


      <!-- Suggested Actions -->
      <div class="actions-chips" *ngIf="m.actions && m.actions.length > 0">
        <button type="button" *ngFor="let act of m.actions" (click)="sendMessage(act)">
          {{ act }}
        </button>
      </div>
    </div>

    <div class="msg-bubble ai typing" *ngIf="loading">
      <span>AI đang suy nghĩ...</span>
    </div>
  </div>

  <div class="chat-footer">
    <input type="text" aria-label="Tin nhắn cho trợ lý GOAT Sports" [(ngModel)]="inputText" (keyup.enter)="sendMessage()" placeholder="Hỏi tìm sân, đối thủ ghép kèo..." />
    <button type="button" class="btn-send" aria-label="Gửi tin nhắn" (click)="sendMessage()"><i class="pi pi-send" aria-hidden="true"></i></button>
  </div>
</div>
