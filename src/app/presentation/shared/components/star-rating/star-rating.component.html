<div class="star-rating-container" [ngClass]="size">
  @for (star of stars; track $index) {
    @if (star === 'full') {
      <lucide-icon name="star" class="star-icon full"></lucide-icon>
    } @else if (star === 'half') {
      <lucide-icon name="star-half" class="star-icon half"></lucide-icon>
    } @else {
      <lucide-icon name="star" class="star-icon empty"></lucide-icon>
    }
  }
  @if (rating > 0) {
    <span class="rating-value">{{ rating | number:'1.1-1' }}</span>
  }
</div>
