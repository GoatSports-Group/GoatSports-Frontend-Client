<mat-sidenav-container class="client-container" autosize>

  <!-- Mobile Drawer Sidenav -->
  <mat-sidenav #sidenav mode="over" class="mobile-drawer">
    <div class="drawer-header">
      <img src="assets/images/goat.png" alt="Goat Sports Logo" class="logo-img">
      <span class="logo-text">GOAT<span class="logo-text-accent">Sports</span></span>
    </div>
    <mat-divider></mat-divider>

    <nav class="drawer-menu" aria-label="Điều hướng di động">
      <a routerLink="/home" (click)="closeSidenav()" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
        class="drawer-item">
        <lucide-icon name="home" class="w-4 h-4 mr-2"></lucide-icon> Trang Chủ
      </a>

      <a routerLink="/venues" (click)="closeSidenav()" routerLinkActive="active" class="drawer-item">
        <lucide-icon name="map-pin" class="w-4 h-4 mr-2"></lucide-icon> Tìm sân đấu
      </a>
      <a routerLink="/clubs" (click)="closeSidenav()" routerLinkActive="active" class="drawer-item">
        <lucide-icon name="users" class="w-4 h-4 mr-2"></lucide-icon> Câu lạc bộ
      </a>
      <a routerLink="/tournaments" (click)="closeSidenav()" routerLinkActive="active" class="drawer-item">
        <lucide-icon name="trophy" class="w-4 h-4 mr-2"></lucide-icon> Giải đấu
      </a>

      <mat-divider></mat-divider>

      @if (isAuthenticated$ | async) {
      <a routerLink="/feed" (click)="closeSidenav()" routerLinkActive="active" class="drawer-item">
        <lucide-icon name="messages-square" class="w-4 h-4 mr-2"></lucide-icon> Bảng tin
      </a>
      <a routerLink="/matchmaking" (click)="closeSidenav()" routerLinkActive="active" class="drawer-item">
        <lucide-icon name="brain" class="w-4 h-4 mr-2"></lucide-icon> AI ghép kèo
      </a>
      <button type="button" class="drawer-item" [matMenuTriggerFor]="mobileConnectionMenu">
        <lucide-icon name="messages-square" class="w-4 h-4 mr-2"></lucide-icon> Kết nối
        <lucide-icon name="chevron-down" class="w-4 h-4 ml-auto"></lucide-icon>
      </button>
      <mat-menu #mobileConnectionMenu="matMenu" class="custom-menu connection-menu">
        <button type="button" mat-menu-item routerLink="/friends" (click)="closeSidenav()">
          <lucide-icon name="users" class="w-4 h-4 mr-2"></lucide-icon> Bạn bè
        </button>
        <button type="button" mat-menu-item routerLink="/chat" (click)="closeSidenav()">
          <lucide-icon name="message-circle" class="w-4 h-4 mr-2"></lucide-icon> Tin nhắn
        </button>
      </mat-menu>
      @if (currentUser?.role?.name === 'ADMIN' || currentUser?.role?.name === 'Người quản trị') {
      <a [href]="adminUrl + '/admin'" (click)="closeSidenav()" class="drawer-item admin-link">
        <lucide-icon name="shield-check" class="w-4 h-4 mr-2 text-primary"></lucide-icon> Quản Trị Admin
      </a>
      }
      <button type="button" (click)="logout(); closeSidenav()" class="drawer-item logout-link">
        <lucide-icon name="log-out" class="w-4 h-4 mr-2 text-red-500"></lucide-icon> Đăng Xuất
      </button>
      } @else {
      <button type="button" (click)="redirectToLogin(); closeSidenav()" class="drawer-item login-link">
        <lucide-icon name="log-in" class="w-4 h-4 mr-2 text-primary"></lucide-icon> Đăng Nhập
      </button>
      }
    </nav>
  </mat-sidenav>

  <!-- Main Client Page Content -->
  <mat-sidenav-content class="client-content-wrapper">
    <app-header (menuToggle)="toggleSidenav()"></app-header>

    <main id="main-content" class="client-main-outlet" tabindex="-1">
      <router-outlet></router-outlet>
    </main>

    @if (showFooter) {
      <app-footer></app-footer>
    }
    <app-ai-assistant-modal></app-ai-assistant-modal>
  </mat-sidenav-content>

</mat-sidenav-container>
