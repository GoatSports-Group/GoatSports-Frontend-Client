<section class="owner-page">
  <div class="owner-page__container">
    @if (activeView === 'history') {
      <header class="owner-page__header">
        <div class="owner-page__intro">
          <p class="owner-page__eyebrow">Quản lý hồ sơ</p>
          <h1 class="owner-page__title">Lịch sử đăng ký</h1>
          <p class="owner-page__description">
            Theo dõi những hồ sơ đã tạo và tiếp tục hoàn thiện khi cần.
          </p>
        </div>
        <button type="button" class="owner-page__button" (click)="openForm()">
          Đăng ký chủ sân
        </button>
      </header>

      <app-owner-application-history
        [applications]="applications"
        [loading]="loading"
        (createApplication)="openForm()" />
    } @else {
      <header class="owner-page__header">
        <div class="owner-page__intro">
          <p class="owner-page__eyebrow">Hồ sơ đối tác</p>
          <h1 class="owner-page__title">Đăng ký trở thành chủ sân</h1>
          <p class="owner-page__description">
            Hoàn tất vài thông tin thiết yếu để GOAT SPORTS xác minh và đưa sân của bạn lên hệ thống.
          </p>
        </div>
        <button type="button" class="owner-page__button" (click)="openHistory()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path stroke-linecap="round" d="M12 7v5l3 2" />
          </svg>
          Xem lịch sử đăng ký
        </button>
      </header>

      <app-owner-application-form
        (backToHistory)="openHistory()"
        (submitted)="handleSubmitted($event)" />
    }
  </div>
</section>
