<section class="profile-page">
  <div class="profile-page__container">
    <!-- Header Section -->
    <header class="profile-page__header">
      <div class="profile-page__intro">
        <p class="profile-page__eyebrow">Tài khoản cá nhân</p>
        <h1 class="profile-page__title">Cài Đặt Tài Khoản</h1>
        <p class="profile-page__description">
          Quản lý thông tin hồ sơ, tùy biến giao diện hệ thống và thiết lập bảo mật an toàn.
        </p>
      </div>
    </header>

    <!-- Athletic Segmented Navigation Tabs -->
    <nav class="profile-tabs" aria-label="Profile navigation tabs">
      <div class="profile-tabs__nav">
        @for (tab of tabs; track tab.key) {
          <button
            type="button"
            class="profile-tabs__btn"
            [class.profile-tabs__btn--active]="activeTab === tab.key"
            (click)="setActiveTab(tab.key)"
          >
            <lucide-icon [name]="tab.icon" class="w-4 h-4 mr-2"></lucide-icon>
            <span>{{ tab.label }}</span>
          </button>
        }
      </div>
    </nav>

    <!-- Tab Content View Container -->
    <main class="profile-page__content">
      @switch (activeTab) {
        @case ('info') {
          <app-profile-info [user]="authService.currentUser" />
        }
        @case ('settings') {
          <app-profile-settings />
        }
        @case ('security') {
          <app-profile-security [user]="authService.currentUser" />
        }
      }
    </main>
  </div>
</section>
